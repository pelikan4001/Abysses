<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abysses · Lexique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg1:#0b2a3c;--bg2:#06121c;--ink:#e8f3f7;--mute:#8fb3c4;--line:rgba(160,210,230,.18);
  --card:rgba(255,255,255,.06);--accent:#5fe0c8;--warn:#ff8f70;
  --t1:#9fd8ee;--t2:#62c6c0;--t3:#5ea8ff;--t4:#a98bff;--t5:#ffd36e;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg2);
  background-image:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 70%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px;}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0}
h1{font-size:34px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:6px 0 22px;line-height:1.45;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{background:var(--accent);color:#04201b;font-weight:600;padding:14px 18px;width:100%;font-size:16px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.daily{background:linear-gradient(135deg,#123f57,#0d2636);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:22px}
.daily .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.daily h2{font-size:24px;margin:6px 0 4px}
.daily p{color:var(--mute);margin:0 0 14px;font-size:14px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:8px 0 10px;font-weight:600}
.chapters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--ink)}
.ch .e{font-size:24px}
.ch .n{font-weight:600;margin-top:6px}
.ch .b{font-size:12px;color:var(--mute);margin-top:2px}
details{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
details p,details li{color:var(--mute);font-size:14px;line-height:1.5}
.tiers{list-style:none;padding:0;margin:8px 0 0}
.tiers li{display:flex;justify-content:space-between;padding:4px 0}
/* game */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .x{background:none;color:var(--mute);font-size:14px;padding:6px 0}
.top .chn{font-weight:600}
.layout{display:flex;gap:14px}
.gauge{width:34px;flex:none;position:relative;border-radius:18px;background:linear-gradient(180deg,#2b7fa3,#0f3b52 45%,#061019);border:1px solid var(--line);min-height:380px;overflow:hidden}
.gauge .fill{position:absolute;left:0;right:0;top:0;background:rgba(95,224,200,.18);transition:height .7s ease}
.gauge .dot{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);transition:top .7s ease}
.gauge .m{position:absolute;left:0;right:0;text-align:center;font-size:9px;color:rgba(255,255,255,.45)}
.main{flex:1;min-width:0}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:8px}
.timer{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--warn)}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.prompt .kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.prompt h2{font-size:23px;line-height:1.25;margin:8px 0 4px}
.prompt .hint{color:var(--mute);font-size:13px}
form{margin-top:14px;display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
form .btn{width:auto;padding:13px 16px}
.res{margin-top:14px;border-radius:18px;padding:18px;border:1px solid var(--line);background:rgba(0,0,0,.2);animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res .ans{font-size:15px;color:var(--mute)}
.res .tier{font-family:Fraunces,serif;font-size:28px;margin:4px 0}
.res .pts{font-weight:600}
.res .why{color:var(--mute);font-size:13px;margin-top:6px}
.res .ex{margin-top:12px;font-size:13px;color:var(--mute);line-height:1.5}
.res .ex b{color:var(--ink);font-weight:500}
.res .btn{margin-top:14px}
/* end */
.score{text-align:center;padding:10px 0 18px}
.score .big{font-family:Fraunces,serif;font-size:56px;line-height:1}
.score .dep{color:var(--accent);font-weight:600;margin-top:6px}
.score .zone{color:var(--mute);margin-top:4px}
.rows{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line);gap:10px}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .q{font-size:12px;color:var(--mute)}
.row .a{font-weight:500;overflow-wrap:anywhere}
.row .t{font-size:13px;font-weight:600;white-space:nowrap}
.share{white-space:pre;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;overflow:auto}
.stack>*+*{margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e8f3f7;color:#06121c;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.c1{color:var(--t1)}.c2{color:var(--t2)}.c3{color:var(--t3)}.c4{color:var(--t4)}.c5{color:var(--t5)}.c0{color:var(--warn)}
</style>
</head>

/* ============ Normalisation & correspondance ============ */
function norm(s){
  return (s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[’'`\-]/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function stripArticle(s){ return s.replace(/^(le|la|les|un|une|des|du|de la|de l|l|d)\s+/,""); }
function stripPron(s){ return s.replace(/^(se|s|me|m)\s+/,""); }
function letters(s){ return norm(s).replace(/[^a-z]/g,"").length; }

const IDX = {}; // chapterId -> {n:Map, v:Map, a:Map, all:Map, x:[[frag,tier]]}
for(const ch of CHAPTERS){
  const d = {n:new Map(), v:new Map(), a:new Map(), all:new Map(), x:[], disp:new Map()};
  for(const k of ["n","v","a"]){
    ch[k].forEach((str,i)=>{
      str.split("|").forEach(w=>{
        const key = norm(w); if(!key) return;
        if(!d[k].has(key)) d[k].set(key,i+1);
        if(!d.all.has(key)) d.all.set(key,i+1);
        if(!d.disp.has(key)) d.disp.set(key,w);
      });
    });
  }
  ch.x.forEach((str,i)=>str.split("|").forEach(f=>{const k=norm(f); if(k) d.x.push([k,i+1]);}));
  IDX[ch.id]=d;
}
function variants(s){
  const out=new Set([s]);
  const add=v=>{ if(v&&v.length>1) out.add(v); };
  add(s.replace(/s$/,"")); add(s.replace(/x$/,""));
  add(s.replace(/aux$/,"al"));
  add(s.replace(/e$/,"")); add(s.replace(/es$/,""));
  add(s.replace(/euse$/,"eux")); add(s.replace(/euses$/,"eux"));
  add(s.replace(/ive$/,"if")); add(s.replace(/ives$/,"if"));
  add(s.replace(/elle$/,"el")); add(s.replace(/enne$/,"en"));
  add(s.replace(/ere$/,"er")); add(s.replace(/eres$/,"er"));
  add(s.replace(/che$/,"c")); add(s.replace(/ouce$/,"oux"));
  add(s.replace(/eille$/,"eil")); add(s.replace(/ette$/,"et"));
  return [...out];
}
function lookup(map, raw){
  const s = norm(raw);
  const cands = [s, stripArticle(s), stripPron(s)];
  for(const c of cands) for(const v of variants(c)) if(map.has(v)) return {key:v, tier:map.get(v)};
  return null;
}

/* ============ Les 7 manches ============ */
const ROUNDS = [
  {kind:"Nom",        q:ch=>`Un nom lié à ${ch.of}`,                         hint:"Un nom commun, au singulier ou au pluriel.", pool:"n"},
  {kind:"Verbe",      q:ch=>`Un verbe lié à ${ch.of}`,                       hint:"À l’infinitif.", pool:"v"},
  {kind:"Adjectif",   q:ch=>`Un adjectif lié à ${ch.of}`,                    hint:"Masculin ou féminin, peu importe.", pool:"a"},
  {kind:"Expression", q:ch=>`Une expression française liée à ${ch.of}`,      hint:"Un idiome, un dicton, une locution…", pool:"x"},
  {kind:"Mot long",   q:ch=>`Un mot de 9 lettres ou plus lié à ${ch.of}`,    hint:"Nom, verbe ou adjectif.", pool:"all", test:w=>letters(w)>=9, fail:"Moins de 9 lettres."},
  {kind:"Initiale",   q:ch=>`Un mot lié à ${ch.of} qui commence par « ${ch.letter} »`, hint:"Nom, verbe ou adjectif.", pool:"all", test:(w,ch)=>stripPron(stripArticle(norm(w))).startsWith(ch.letter.toLowerCase()), fail:ch=>`Ne commence pas par « ${ch.letter} ».`},
  {kind:"Mot court",  q:ch=>`Un mot de 5 lettres maximum lié à ${ch.of}`,   hint:"Nom, verbe ou adjectif.", pool:"all", test:w=>letters(stripArticle(norm(w)))<=5, fail:"Plus de 5 lettres."},
];

function judge(ch, r, raw){
  const d = IDX[ch.id], R = ROUNDS[r];
  if(!norm(raw)) return {tier:0, why:"Temps écoulé ou réponse vide."};
  if(R.pool==="x"){
    const s = norm(raw); let best=null;
    for(const [f,t] of d.x) if(s.includes(f) && (!best || f.length>best[0].length)) best=[f,t];
    return best ? {tier:best[1]} : {tier:0, why:"Expression introuvable dans le lexique de ce chapitre."};
  }
  if(R.test && !R.test(raw,ch)) return {tier:0, why: typeof R.fail==="function"?R.fail(ch):R.fail};
  const hit = lookup(d[R.pool], raw);
  if(hit) return {tier:hit.tier};
  if(R.pool!=="all" && lookup(d.all, raw)) return {tier:0, why:`Bien vu, mais ce n’est pas un${R.kind==="Expression"?"e":""} ${R.kind.toLowerCase()} dans notre lexique.`};
  return {tier:0, why:"Ce mot n’est pas dans le lexique de ce chapitre."};
}
function examples(ch, r){
  const d = IDX[ch.id], R = ROUNDS[r];
  if(R.pool==="x") return [];
  let list=[...d[R.pool].entries()].filter(([k,t])=>t>=4).map(([k])=>d.disp.get(k));
  if(R.test) list=list.filter(w=>R.test(w,ch));
  return pick(list,3);
}
function pick(arr,n){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); }

function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dailyChapter(){ const d=new Date(); const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); return CHAPTERS[n%CHAPTERS.length]; }

      <button class="btn" data-go="${dc.id}" data-daily="1">${done?"Rejouer":"Plonger"}</button>
    </div>
    <div class="sec">Chapitres du lexique</div>
    <div class="chapters">
      ${CHAPTERS.map(c=>`<button class="ch" data-go="${c.id}"><div class="e">${c.emoji}</div><div class="n">${esc(c.name)}</div><div class="b">${best[c.id]!=null?`Record : ${best[c.id]*10} m`:"Pas encore plongé"}</div></button>`).join("")}
    </div>
    <details>
      <summary>Comment jouer</summary>
      <p>Chaque chapitre propose 7 manches : un nom, un verbe, un adjectif, une expression, un mot long (9 lettres et plus), un mot commençant par une lettre imposée et un mot court (5 lettres max). Une seule réponse par manche.</p>
      <p>Chaque réponse acceptée est classée selon sa rareté dans le lexique du chapitre :</p>
      <ul class="tiers">${TIERS.slice(1).map(t=>`<li><span class="${t.cls}">${t.emo} ${t.name}</span><span>${t.pts} pts</span></li>`).join("")}<li><span class="c0">${TIERS[0].emo} ${TIERS[0].name}</span><span>0 pt</span></li></ul>
      <p>1 point = 10 mètres de profondeur. Score parfait : 700 pts, soit 7 000 m. Les accents, majuscules, articles et pluriels sont tolérés.</p>
    </details>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(b.dataset.go, !!b.dataset.daily));
}

function start(id, isDaily){
  S = {ch:CHAPTERS.find(c=>c.id===id), r:0, answers:[], pts:0, daily:isDaily};
  round();
}

function gaugeHTML(){
  const pct = Math.min(100, S.pts/700*100);
  return `<div class="gauge"><div class="fill" style="height:${pct}%"></div>
    ${[0,2000,4000,6000].map(m=>`<div class="m" style="top:${m/7000*100+1}%">${m/1000}k</div>`).join("")}
    <div class="dot" style="top:calc(${pct}% - ${pct>0?7:-4}px)"></div></div>`;
}

function round(){
  clearInterval(timerId);
  const ch=S.ch, R=ROUNDS[S.r];
  app.innerHTML = `
    <div class="top"><button class="x" id="quit">← Quitter</button><span class="chn">${ch.emoji} ${esc(ch.name)}</span></div>
    <div class="layout">${gaugeHTML()}
      <div class="main">
        <div class="meta"><span>Manche ${S.r+1}/7</span><span>${S.pts*10} m</span></div>
        <div class="timer"><i id="bar"></i></div>
        <div class="prompt">
          <div class="kind">${R.kind}</div>
          <h2>${esc(R.q(ch))}</h2>
          <div class="hint">${R.hint}</div>
          <form id="f"><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse…" enterkeyhint="send"><button class="btn" type="submit">OK</button></form>
        </div>
        <div id="out"></div>
      </div>
    </div>`;
  document.getElementById("quit").onclick=home;
  const inp=document.getElementById("in"); inp.focus();
  const bar=document.getElementById("bar");
  const t0=Date.now(); let locked=false;
  const submit=()=>{ if(locked) return; locked=true; clearInterval(timerId); reveal(inp.value); };
  document.getElementById("f").onsubmit=e=>{e.preventDefault(); if(norm(inp.value)) submit();};
  timerId=setInterval(()=>{
    const left=TIME-(Date.now()-t0)/1000;
    bar.style.width=Math.max(0,left/TIME*100)+"%";
    bar.classList.toggle("low",left<6);
    if(left<=0) submit();
  },100);
}

function reveal(raw){
  const ch=S.ch, R=ROUNDS[S.r];
  const res=judge(ch,S.r,raw), T=TIERS[res.tier];
  S.pts+=T.pts; S.answers.push({raw:raw.trim(), tier:res.tier});
  const inp=document.getElementById("in"); inp.disabled=true;
  document.querySelector("#f button").disabled=true;
  const ex=examples(ch,S.r);
  document.getElementById("out").innerHTML = `
    <div class="res">
      <div class="ans">${raw.trim()?`« ${esc(raw.trim())} »`:"Pas de réponse"}</div>
      <div class="tier ${T.cls}">${T.emo} ${T.name}</div>
      <div class="pts">+${T.pts} pts · ${T.pts*10} m</div>
      ${res.why?`<div class="why">${esc(res.why)}</div>`:""}
      ${ex.length?`<div class="ex">Perles possibles : <b>${ex.map(esc).join("</b>, <b>")}</b></div>`:""}
      <button class="btn" id="next">${S.r<6?"Manche suivante":"Remonter à la surface"}</button>
    </div>`;
  document.querySelector(".gauge").outerHTML = gaugeHTML();
  document.querySelector(".meta span:last-child").textContent = S.pts*10+" m";
  const nb=document.getElementById("next"); nb.focus();
  nb.onclick=()=>{ S.r++; S.r<7?round():finish(); };
}

function finish(){
  clearInterval(timerId);
  const ch=S.ch, m=S.pts*10;
  const best=store.get("best",{}); const rec = best[ch.id]==null || S.pts>best[ch.id];
  if(rec){ best[ch.id]=S.pts; store.set("best",best); }
  if(S.daily){ const d=store.get("daily",{}); if(d.date!==todayKey()) store.set("daily",{date:todayKey(),pts:S.pts}); }
  const share = `Abysses · ${ch.name}${S.daily?" (plongée du jour)":""}\n${S.answers.map(a=>TIERS[a.tier].emo).join("")}\n${m.toLocaleString("fr-FR")} m — ${zoneOf(m)}`;
  app.innerHTML = `
    <div class="top"><button class="x" id="quit">← Accueil</button><span class="chn">${ch.emoji} ${esc(ch.name)}</span></div>
    <div class="score">
      <div class="big">${m.toLocaleString("fr-FR")} m</div>
      <div class="dep">${S.pts} / 700 pts${rec?" · nouveau record !":""}</div>
      <div class="zone">${zoneOf(m)}</div>
    </div>
    <div class="rows">${S.answers.map((a,i)=>{const T=TIERS[a.tier];return `<div class="row"><div class="l"><div class="q">${ROUNDS[i].kind}</div><div class="a">${a.raw?esc(a.raw):"—"}</div></div><div class="t ${T.cls}">${T.emo} ${T.pts}</div></div>`}).join("")}</div>
    <div class="share">${esc(share)}</div>
    <div class="stack">
      <button class="btn" id="copy">Copier le résultat</button>
      <button class="btn ghost" id="again">Rejouer ce chapitre</button>
      <button class="btn ghost" id="home">Autres chapitres</button>
    </div>`;
  document.getElementById("quit").onclick=home;
  document.getElementById("home").onclick=home;
  document.getElementById("again").onclick=()=>start(ch.id,false);
  document.getElementById("copy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(share); toast("Copié !"); }
    catch(e){ toast("Copie impossible — sélectionne le texte"); }
  };
}

home();
</script>
</body>
</html>
